<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            width: 100%;
            overflow: visible;
        }
        .search-container-box {
            width: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .search-wrapper {
            width: 100%;
            min-height: 155px;
            position: relative;
            background-color: #081728;
            border: 1px solid rgba(47, 128, 237, 0.35);
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
            display: flex;
            flex-direction: column;
        }
        .search-wrapper:focus-within {
            border-color: #2F80ED;
            box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.25), 0 6px 20px rgba(0, 0, 0, 0.35);
            background-color: #0A1728;
        }
        .search-wrapper.has-dropdown {
            border-bottom-left-radius: 0px !important;
            border-bottom-right-radius: 0px !important;
            border-bottom: 1px dashed rgba(148, 163, 184, 0.25) !important;
        }
        .textarea-container {
            position: relative;
            width: 100%;
            min-height: 150px;
            display: flex;
            align-items: flex-end;
        }
        .search-textarea {
            width: 100%;
            min-height: 145px;
            max-height: 240px;
            padding: 16px 64px 16px 18px;
            font-size: 15px;
            line-height: 1.55;
            color: #F8FAFC;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-y: auto;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        .search-textarea::placeholder {
            color: #64748B;
            font-size: 14.5px;
        }
        .search-textarea[dir="rtl"] {
            padding: 16px 18px 16px 64px;
        }

        /* Embedded Send / Ask Action Button */
        .submit-btn {
            position: absolute;
            right: 12px;
            bottom: 12px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2F80ED 0%, #7C3AED 100%);
            border: none;
            color: #FFFFFF;
            font-size: 20px;
            font-weight: 700;
            display: flex !important;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(47, 128, 237, 0.35);
            transition: all 0.2s ease;
            z-index: 10;
            outline: none;
            visibility: visible !important;
            opacity: 1 !important;
        }
        .submit-btn:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(47, 128, 237, 0.5);
        }
        .submit-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(47, 128, 237, 0.3);
        }

        /* Normal Document Flow Autocomplete Dropdown */
        .dropdown-menu {
            display: none;
            width: 100%;
            background: #0D1D30;
            border: 1px solid rgba(47, 128, 237, 0.35);
            border-top: none;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
            z-index: 9999;
            overflow: visible;
            margin-top: -1px;
        }
        .dropdown-item {
            padding: 13px 16px;
            min-height: 44px;
            font-size: 14.5px;
            line-height: 1.45;
            color: #F8FAFC;
            cursor: pointer;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            white-space: normal !important;
            word-break: break-word !important;
            overflow-wrap: anywhere !important;
            transition: background 0.12s ease, color 0.12s ease;
            text-align: start;
        }
        .dropdown-item:last-child {
            border-bottom: none;
            border-bottom-left-radius: 14px;
            border-bottom-right-radius: 14px;
        }
        .dropdown-item:hover {
            background-color: #0A1728;
            color: #22D3EE;
        }
        .icon {
            color: #22D3EE;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 2px;
        }
        /* Light Theme Overrides */
        body.light-theme .search-wrapper {
            background-color: #FFFFFF;
            border: 1px solid #CBD5E1;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
        }
        body.light-theme .search-wrapper:focus-within {
            border-color: #0284C7;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2), 0 6px 20px rgba(15, 23, 42, 0.1);
            background-color: #FFFFFF;
        }
        body.light-theme .search-textarea {
            color: #0F172A;
        }
        body.light-theme .search-textarea::placeholder {
            color: #94A3B8;
        }
        body.light-theme .submit-btn {
            background: linear-gradient(135deg, #0284C7 0%, #2563EB 100%);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        body.light-theme .submit-btn:hover {
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.45);
        }
        body.light-theme .dropdown-menu {
            background: #FFFFFF;
            border: 1px solid #CBD5E1;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
        }
        body.light-theme .dropdown-item {
            color: #0F172A;
            border-bottom: 1px solid #F1F5F9;
        }
        body.light-theme .dropdown-item:hover {
            background-color: #F1F5F9;
            color: #0284C7;
        }
        body.light-theme .icon {
            color: #0284C7;
        }
    </style>
</head>
<body>
    <div class="search-container-box">
        <div id="searchWrapper" class="search-wrapper">
            <div class="textarea-container">
                <textarea id="searchInput" class="search-textarea" dir="auto" placeholder="Ask a clinical question..." autocomplete="off" spellcheck="false"></textarea>
                <button type="button" id="submitBtn" class="submit-btn" title="Submit Question"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="white"/></svg></button>
            </div>
        </div>
        <div id="autocompleteDropdown" class="dropdown-menu"></div>
    </div>

    <script>
        const Streamlit = {
            setComponentReady: function() {
                window.dispatchEvent(new CustomEvent("streamlit:componentReady"));
                this.postMessage({type: "streamlit:componentReady", apiVersion: 1});
            },
            setFrameHeight: function(height) {
                this.postMessage({type: "streamlit:setFrameHeight", height: height});
            },
            setComponentValue: function(value) {
                this.postMessage({type: "streamlit:setComponentValue", value: value});
            },
            postMessage: function(message) {
                window.parent.postMessage(Object.assign({isStreamlitMessage: true}, message), "*");
            }
        };

        const GROUNDED_QUESTIONS = [
            "What are the symptoms of high blood pressure?",
            "What are the symptoms of high blood pressure in pregnancy?",
            "What are the symptoms of pulmonary hypertension?",
            "Are there warning signs or symptoms associated with hypertension?",
            "What blood pressure level does WHO recommend for starting treatment?",
            "What are the recommended first-line drugs for hypertension treatment?",
            "What combination drug therapy is recommended for blood pressure control?",
            "When should pharmacological treatment for hypertension be started?",
            "What is the target blood pressure according to the WHO guideline?",
            "What is the target blood pressure for patients with known cardiovascular disease?",
            "What blood pressure threshold should trigger starting medication?",
            "What is considered normal vs high blood pressure?",
            "What blood pressure threshold applies in pregnancy?",
            "How is high blood pressure managed in pregnancy according to clinical guidelines?",
            "What lifestyle interventions are recommended for managing hypertension?",
            "How does dietary salt reduction affect blood pressure?",
            "What non-pharmacological measures help lower blood pressure?",
            "What are the cardiovascular risks associated with untreated hypertension?",
            "How does high blood pressure affect heart and kidney health?",
            "Which patient groups are at highest risk from high blood pressure?",
            "ما هي أعراض ارتفاع ضغط الدم؟",
            "ما هي أعراض ارتفاع ضغط الدم أثناء الحمل؟",
            "ما هي أعراض ارتفاع ضغط الدم الرئوي؟",
            "هل هناك علامات تحذيرية مرتبطة بارتفاع ضغط الدم؟",
            "ما مستوى ضغط الدم الذي توصي منظمة الصحة العالمية ببدء العلاج عنده؟",
            "ما هي الأدوية الأولى الموصى بها لعلاج ارتفاع ضغط الدم؟",
            "ما هو العلاج الدوائي المركب الموصى به للتحكم في ضغط الدم؟",
            "متى يجب بدء العلاج الدوائي لارتفاع ضغط الدم؟",
            "ما هو هدف ضغط الدم وفقاً لإرشادات منظمة الصحة العالمية؟",
            "ما هو هدف ضغط الدم للمرضى المصابين بأمراض القلب والأوعية الدموية؟",
            "ما مستوى ضغط الدم الذي يجب أن يثير بدء تناول الدواء؟",
            "ما هو ضغط الدم الطبيعي مقارنة بالمرتفع؟",
            "ما مستوى ضغط الدم المطبق أثناء الحمل؟",
            "كيف يتم التعامل مع ارتفاع ضغط الدم أثناء الحمل وفقاً للإرشادات السريرية؟",
            "ما هي التدخلات في نمط الحياة الموصى بها لإدارة ارتفاع ضغط الدم؟",
            "كيف يؤثر تقليل الملح في النظام الغذائي على ضغط الدم؟",
            "ما هي التدابير غير الدوائية التي تساعد في خفض ضغط الدم؟",
            "ما هي المخاطر القلبية الوعائية المرتبطة مع عدم علاج ارتفاع ضغط الدم؟",
            "كيف يؤثر ارتفاع ضغط الدم على صحة القلب والكلى؟",
            "ما هي فئات المرضى الأكثر عرضة للخطر من ارتفاع ضغط الدم؟",
            "Quels sont les symptômes de l'hypertension artérielle?",
            "Quel niveau de tension artérielle l'OMS recommande-t-elle pour commencer le traitement?",
            "Quels sont les médicaments de première ligne recommandés pour l'hypertension?",
            "Quelle est la tension artérielle cible selon les directives de l'OMS?",
            "¿Cuáles son los síntomas de la presión arterial alta?",
            "¿Qué nivel de presión arterial recomienda la OMS para iniciar el tratamiento?",
            "¿Cuáles son los medicamentos de primera línea recomendados para la hipertensión?",
            "¿Cuál es la presión arterial objetivo según las directrices de la OMS?"
        ];

        function isArabicText(text) {
            return /[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/.test(text);
        }

        function getFilteredPool(queryText) {
            const isArabic = isArabicText(queryText);
            if (isArabic) {
                return GROUNDED_QUESTIONS.filter(q => isArabicText(q));
            }
            const latinPool = GROUNDED_QUESTIONS.filter(q => !isArabicText(q));
            return latinPool.length > 0 ? latinPool : GROUNDED_QUESTIONS;
        }

        const searchWrapper = document.getElementById("searchWrapper");
        const searchInput = document.getElementById("searchInput");
        const submitBtn = document.getElementById("submitBtn");
        const dropdown = document.getElementById("autocompleteDropdown");
        
        let isComposing = false;
        let isFocused = false;
        let isSelectedJustNow = false;

        function resizeComponent() {
            requestAnimationFrame(function() {
                const bodyH = document.body.scrollHeight || document.documentElement.scrollHeight || 175;
                const wrapperH = searchWrapper ? searchWrapper.offsetHeight : 165;
                const dropH = (dropdown && dropdown.style.display === "block") ? (dropdown.scrollHeight || dropdown.offsetHeight || 0) : 0;
                const needed = Math.max(bodyH, wrapperH + dropH + 16, 175);
                Streamlit.setFrameHeight(needed);
            });
        }

        function autoResize() {
            if (!searchInput) return;
            searchInput.style.height = "145px";
            const scrollH = searchInput.scrollHeight;
            if (scrollH > 145) {
                searchInput.style.height = Math.min(scrollH, 240) + "px";
            }
            resizeComponent();
        }

        function sendValue(isSubmitted) {
            if (!searchInput) return;
            const val = searchInput.value;
            Streamlit.setComponentValue({
                query: val,
                submitted: isSubmitted,
                timestamp: Date.now()
            });
        }

        searchInput.addEventListener("focus", function() {
            isFocused = true;
        });

        searchInput.addEventListener("blur", function() {
            isFocused = false;
        });

        searchInput.addEventListener("compositionstart", function() {
            isComposing = true;
        });

        searchInput.addEventListener("compositionupdate", function() {
            isComposing = true;
        });

        searchInput.addEventListener("compositionend", function(e) {
            isComposing = false;
            autoResize();
            sendValue(false);
            updateSuggestions(searchInput.value);
        });

        window.addEventListener("message", function(event) {
            if (event.data && event.data.type === "streamlit:render") {
                const args = event.data.args || {};
                if (args.theme === "light") {
                    document.body.classList.add("light-theme");
                } else {
                    document.body.classList.remove("light-theme");
                }
                if (!isFocused && !isComposing && args.initial_value !== undefined && typeof args.initial_value === "string") {
                    if (searchInput.value !== args.initial_value && !isSelectedJustNow) {
                        searchInput.value = args.initial_value;
                        autoResize();
                    }
                }
            }
        });

        function updateSuggestions(val) {
            if (isComposing) return;

            const rawVal = (val || "").trim();
            if (!rawVal || isSelectedJustNow) {
                dropdown.style.display = "none";
                searchWrapper.classList.remove("has-dropdown");
                resizeComponent();
                isSelectedJustNow = false;
                return;
            }

            const query = rawVal.toLowerCase().normalize("NFC");
            const pool = getFilteredPool(rawVal);

            const matched = pool.filter(q => {
                const qLower = q.toLowerCase().normalize("NFC");
                if (qLower.includes(query)) return true;
                const words = qLower.split(/\s+/);
                return words.some(w => w.startsWith(query));
            }).slice(0, 4);

            if (matched.length === 0) {
                dropdown.style.display = "none";
                searchWrapper.classList.remove("has-dropdown");
                resizeComponent();
                return;
            }

            dropdown.innerHTML = "";
            matched.forEach(text => {
                const item = document.createElement("div");
                item.className = "dropdown-item";
                item.setAttribute("dir", "auto");
                item.innerHTML = `<span class="icon">🔍</span><span>${text}</span>`;
                
                item.addEventListener("mousedown", function(e) {
                    e.preventDefault();
                    searchInput.value = text;
                    isSelectedJustNow = true;
                    dropdown.style.display = "none";
                    searchWrapper.classList.remove("has-dropdown");
                    autoResize();
                    sendValue(false);
                    resizeComponent();
                });
                
                dropdown.appendChild(item);
            });

            dropdown.style.display = "block";
            searchWrapper.classList.add("has-dropdown");
            resizeComponent();
        }

        searchInput.addEventListener("input", function(e) {
            if (isComposing) return;
            isSelectedJustNow = false;
            autoResize();
            sendValue(false);
            updateSuggestions(searchInput.value);
        });

        searchInput.addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey && !isComposing) {
                e.preventDefault();
                dropdown.style.display = "none";
                searchWrapper.classList.remove("has-dropdown");
                sendValue(true);
                resizeComponent();
            }
        });

        submitBtn.addEventListener("click", function(e) {
            e.preventDefault();
            dropdown.style.display = "none";
            searchWrapper.classList.remove("has-dropdown");
            sendValue(true);
            resizeComponent();
        });

        document.addEventListener("click", function(e) {
            if (!e.target.closest(".search-container-box")) {
                dropdown.style.display = "none";
                searchWrapper.classList.remove("has-dropdown");
                resizeComponent();
            }
        });

        Streamlit.setFrameHeight(175);
        Streamlit.setComponentReady();
        autoResize();
    </script>
</body>
</html>
